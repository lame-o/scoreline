<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Scoreline marketing frame</title>
<!--
  The marketing frames (compose.mjs renders this page headless, one spec at a
  time, from the JSON in the URL's hash). Kinds:

    browser   a Safari-like window on a gradient, with a caption above
    phones    two phones on a gradient, with a caption above
    mac       the Mac menu bar with Scoreline's panel(s) dropped from it
    bare      just the window or phone, on transparency (the README's galleries)
    social    GitHub's 1280×640 social preview

  Every length is in canvas pixels at the spec's width (2400 for the
  marketing shots); compose.mjs scales the 1600×1000 copies down from them.
-->
<style>
  @font-face { font-family: "SF Display"; src: local("SF Pro Display"), local(".SF NS Display"), local("SFNS"), local(".SFNS-Regular"); }
  :root {
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    --rounded: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  body { font-family: var(--sans); -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision; }

  /* MARK: The canvas and its light (the launch brief's style guide: night ice, dithered) */
  .canvas { position: relative; overflow: hidden; width: var(--w); height: var(--h); isolation: isolate; }
  .canvas.light { background: #f1f5f8; color: #10151f; --key: #e4501b; --sub: rgba(16, 21, 31, 0.62); }
  .canvas.dark { background: #0a0f1c; color: #f3f6fa; --key: #ff6a33; --sub: rgba(243, 246, 250, 0.64); }
  .canvas.bare { background: transparent; }
  .field { position: absolute; inset: 0; z-index: -3; }
  .dark .field { background:
      radial-gradient(42% 52% at 50% var(--glow-y, 62%), rgba(191, 227, 255, 0.2), transparent 72%),
      radial-gradient(70% 60% at 50% 115%, rgba(60, 110, 190, 0.22), transparent 70%),
      linear-gradient(180deg, #0a0f1c 0%, #0f1a2c 55%, #14243a 100%); }
  .light .field { background:
      radial-gradient(42% 52% at 50% var(--glow-y, 62%), rgba(255, 106, 51, 0.08), transparent 72%),
      radial-gradient(60% 60% at 50% 0%, rgba(255, 255, 255, 0.8), transparent 70%),
      linear-gradient(180deg, #f1f5f8 0%, #e6eef4 55%, #dce7ef 100%); }
  /* Dither: 1-bit noise at a few percent, the icon's texture as grain (drawn once into a tile below). */
  .dither { position: absolute; inset: 0; z-index: -1; pointer-events: none; background-image: var(--dither); background-size: 256px 256px; image-rendering: pixelated; }
  .dark .dither { opacity: 0.045; mix-blend-mode: screen; }
  .light .dither { opacity: 0.035; mix-blend-mode: multiply; }
  /* Halftone: the icon's dot screen, faint, in the glow behind the subject. */
  .halftone { position: absolute; z-index: -2; inset: 0; background-size: var(--dot) var(--dot);
    -webkit-mask-image: radial-gradient(38% 46% at 50% var(--glow-y, 62%), rgba(0,0,0,1), transparent 75%); }
  .dark .halftone { background-image: radial-gradient(circle, rgba(191, 227, 255, 0.12) 28%, transparent 34%); }
  .social .halftone { opacity: 0.5; }
  .light .halftone { background-image: radial-gradient(circle, rgba(60, 90, 130, 0.07) 28%, transparent 34%); }

  /* MARK: The caption (one family; the key word in red-orange) */
  .caption { position: absolute; left: 0; right: 0; top: var(--cap-top); text-align: center; padding: 0 8%; }
  .caption.left { text-align: left; right: auto; width: var(--cap-width); left: var(--cap-left); padding: 0; }
  .title { font-size: calc(var(--u) * var(--title-size, 96)); font-weight: 800; letter-spacing: -0.034em; line-height: 1.02; }
  .title .key { color: var(--key); }
  .subtitle { font-size: calc(var(--u) * 36); font-weight: 500; letter-spacing: -0.008em; line-height: 1.3; margin: calc(var(--u) * 22) auto 0; max-width: calc(var(--u) * 1500); color: var(--sub); }
  .left .subtitle { margin-left: 0; }

  /* MARK: The Safari window */
  .window { position: absolute; left: var(--win-left); top: var(--win-top); width: var(--win-w); border-radius: calc(var(--s) * 12); overflow: hidden; }
  .light .window { background: #fff; box-shadow: 0 0 0 calc(var(--s) * 0.5) rgba(0,0,0,0.18), 0 calc(var(--s) * 22) calc(var(--s) * 70) rgba(20, 30, 60, 0.26), 0 calc(var(--s) * 6) calc(var(--s) * 18) rgba(20, 30, 60, 0.12); }
  .dark .window { background: #1c1c1e; box-shadow: 0 0 0 calc(var(--s) * 0.5) rgba(0,0,0,0.9), inset 0 0 0 calc(var(--s) * 0.5) rgba(255,255,255,0.14), 0 calc(var(--s) * 26) calc(var(--s) * 90) rgba(0, 0, 0, 0.6), 0 calc(var(--s) * 6) calc(var(--s) * 20) rgba(0,0,0,0.35); }
  .bare .window { position: relative; left: 0; top: 0; }
  .bare.light .window { box-shadow: 0 0 0 1px rgba(0,0,0,0.14); }
  .bare.dark .window { box-shadow: 0 0 0 1px rgba(255,255,255,0.16); }
  .toolbar { position: relative; height: calc(var(--s) * 52); display: flex; align-items: center; padding: 0 calc(var(--s) * 18); gap: calc(var(--s) * 16); z-index: 2; }
  .light .toolbar { background: linear-gradient(#f7f7f7, #f0f0f2); border-bottom: calc(var(--s) * 0.5) solid rgba(0,0,0,0.12); color: rgba(0,0,0,0.5); }
  .dark .toolbar { background: linear-gradient(#323234, #2b2b2d); border-bottom: calc(var(--s) * 0.5) solid rgba(0,0,0,0.7); color: rgba(255,255,255,0.55); }
  .lights { display: flex; gap: calc(var(--s) * 8); margin-right: calc(var(--s) * 10); }
  .lights i { width: calc(var(--s) * 12); height: calc(var(--s) * 12); border-radius: 50%; display: block; box-shadow: inset 0 0 0 calc(var(--s) * 0.5) rgba(0,0,0,0.12); }
  .lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
  .tb-icon { width: calc(var(--s) * 18); height: calc(var(--s) * 18); flex: none; }
  .tb-icon svg { width: 100%; height: 100%; display: block; }
  .address { position: absolute; left: 50%; transform: translateX(-50%); width: calc(var(--s) * 520); height: calc(var(--s) * 30); border-radius: calc(var(--s) * 9);
    display: flex; align-items: center; justify-content: center; gap: calc(var(--s) * 6); font-size: calc(var(--s) * 13); font-weight: 500; letter-spacing: -0.005em; }
  .light .address { background: rgba(0,0,0,0.055); color: rgba(0,0,0,0.78); }
  .dark .address { background: rgba(255,255,255,0.075); color: rgba(255,255,255,0.82); }
  .address .lock { width: calc(var(--s) * 10); height: calc(var(--s) * 12); opacity: 0.55; }
  .tb-right { margin-left: auto; display: flex; gap: calc(var(--s) * 18); }
  .content { position: relative; height: var(--content-h); overflow: hidden; }
  .content img { display: block; width: 100%; height: auto; }

  /* MARK: Phones */
  .phone { position: absolute; width: var(--ph-w); height: calc(var(--ph-w) * 2.1305); border-radius: calc(var(--ph-w) * 0.165); padding: calc(var(--ph-w) * 0.031);
    background: linear-gradient(145deg, #4a4a4f, #1d1d20 30%, #2b2b2f 70%, #5a5a60); }
  .phone::before { content: ""; position: absolute; inset: calc(var(--ph-w) * 0.008); border-radius: calc(var(--ph-w) * 0.158); background: #050506; }
  .light .phone { box-shadow: 0 calc(var(--ph-w) * 0.06) calc(var(--ph-w) * 0.16) rgba(20, 30, 60, 0.28), 0 calc(var(--ph-w) * 0.012) calc(var(--ph-w) * 0.03) rgba(20, 30, 60, 0.18); }
  .dark .phone { box-shadow: 0 calc(var(--ph-w) * 0.07) calc(var(--ph-w) * 0.2) rgba(0, 0, 0, 0.65), inset 0 0 0 1px rgba(255,255,255,0.08); }
  .bare .phone { box-shadow: none; position: relative; left: 0 !important; top: 0 !important; }
  .screen { position: relative; width: 100%; height: 100%; border-radius: calc(var(--ph-w) * 0.135); overflow: hidden; z-index: 1; }
  .statusbar { position: absolute; top: 0; left: 0; right: 0; height: var(--sb-h); display: flex; align-items: center; justify-content: space-between;
    padding: 0 calc(var(--ph-w) * 0.085) 0 calc(var(--ph-w) * 0.115); font-weight: 600; font-size: calc(var(--ph-w) * 0.044); z-index: 3; letter-spacing: -0.01em; }
  .statusbar .glyphs { display: flex; gap: calc(var(--ph-w) * 0.016); align-items: center; }
  .statusbar svg { height: calc(var(--ph-w) * 0.031); width: auto; display: block; }
  .island { position: absolute; top: calc(var(--ph-w) * 0.028); left: 50%; transform: translateX(-50%); width: calc(var(--ph-w) * 0.32); height: calc(var(--ph-w) * 0.094); border-radius: 999px; background: #000; z-index: 4; }
  .screen img { position: absolute; left: 0; top: var(--sb-h); width: 100%; height: auto; display: block; }
  .homebar { position: absolute; bottom: calc(var(--ph-w) * 0.02); left: 50%; transform: translateX(-50%); width: calc(var(--ph-w) * 0.35); height: calc(var(--ph-w) * 0.013); border-radius: 999px; z-index: 3; }

  /* MARK: The Mac menu bar */
  .menubar { position: absolute; top: 0; left: 0; right: 0; height: calc(var(--s) * 24); display: flex; align-items: center; justify-content: flex-end; gap: calc(var(--s) * 15);
    padding: 0 calc(var(--s) * 14); font-size: calc(var(--s) * 13); font-weight: 500; letter-spacing: -0.005em; backdrop-filter: blur(20px); z-index: 3;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 45%); }
  .light .menubar { background: rgba(255,255,255,0.42); color: rgba(0,0,0,0.85); box-shadow: 0 calc(var(--s) * 0.5) 0 rgba(0,0,0,0.06); }
  .dark .menubar { background: rgba(20,22,30,0.5); color: rgba(255,255,255,0.92); box-shadow: 0 calc(var(--s) * 0.5) 0 rgba(255,255,255,0.06); }
  .menubar .left { margin-right: auto; display: flex; gap: calc(var(--s) * 20); font-weight: 500; }
  .menubar .left b { font-weight: 700; }
  .menubar .item { display: flex; align-items: center; gap: calc(var(--s) * 5); }
  .menubar .item.active { background: rgba(127,127,127,0.28); border-radius: calc(var(--s) * 5); padding: calc(var(--s) * 2) calc(var(--s) * 7); margin: 0 calc(var(--s) * -7); }
  .menubar svg { height: calc(var(--s) * 14); width: auto; display: block; }
  .menubar .score { font-weight: 500; font-variant-numeric: tabular-nums; }
  .menubar .dot { width: calc(var(--s) * 6); height: calc(var(--s) * 6); border-radius: 50%; background: #ff3b30; }
  .panel { position: absolute; border-radius: calc(var(--s) * 13); overflow: hidden; }
  .panel img { display: block; width: 100%; height: auto; }
  .light .panel { box-shadow: 0 0 0 calc(var(--s) * 0.5) rgba(0,0,0,0.16), 0 calc(var(--s) * 18) calc(var(--s) * 56) rgba(20, 30, 60, 0.28), 0 calc(var(--s) * 4) calc(var(--s) * 14) rgba(20, 30, 60, 0.12); }
  .dark .panel { box-shadow: 0 0 0 calc(var(--s) * 0.5) rgba(0,0,0,0.9), inset 0 0 0 calc(var(--s) * 0.5) rgba(255,255,255,0.14), 0 calc(var(--s) * 22) calc(var(--s) * 70) rgba(0,0,0,0.6); }
  .placeholder { display: grid; place-items: center; text-align: center; font-weight: 600; letter-spacing: -0.01em; }
  .light .placeholder { background: rgba(255,255,255,0.72); color: rgba(0,0,0,0.4); }
  .dark .placeholder { background: rgba(30,30,34,0.82); color: rgba(255,255,255,0.42); }

  /* MARK: Grid of cards (the theaters side by side) */
  .card .shot { width: 100%; border-radius: calc(var(--u) * 24); overflow: hidden; position: relative; }
  .card .shot img { width: 100%; height: 100%; object-fit: cover; object-position: var(--pos, center); display: block; }
  .light .card .shot { background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 calc(var(--u) * 24) calc(var(--u) * 70) rgba(20, 30, 60, 0.2); }
  .dark .card .shot { background: #141416; box-shadow: 0 0 0 1px rgba(255,255,255,0.1), 0 calc(var(--u) * 28) calc(var(--u) * 80) rgba(0, 0, 0, 0.55); }
  .card .label { height: calc(var(--u) * 64); display: flex; align-items: center; gap: calc(var(--u) * 14); padding-left: calc(var(--u) * 6); white-space: nowrap; }
  .card .label b { font-size: calc(var(--u) * 30); font-weight: 700; letter-spacing: -0.02em; }
  .card .label span { font-size: calc(var(--u) * 26); font-weight: 500; }
  .light .card .label span { color: rgba(29, 29, 31, 0.55); }
  .dark .card .label span { color: rgba(245, 245, 247, 0.55); }

  /* MARK: README buttons (2×, on transparency) */
  .btn { display: inline-flex; align-items: center; gap: 14px; height: 104px; padding: 0 46px 0 38px; border-radius: 999px; font-size: 34px; font-weight: 600; letter-spacing: -0.012em; white-space: nowrap; }
  .btn svg { width: 38px; height: 38px; display: block; }
  .light .btn.primary { background: #1d1d1f; color: #fff; }
  .dark .btn.primary { background: #f5f5f7; color: #1d1d1f; }
  .light .btn.secondary { background: rgba(0, 0, 0, 0.06); color: #1d1d1f; box-shadow: inset 0 0 0 2px rgba(0,0,0,0.06); }
  .dark .btn.secondary { background: rgba(255, 255, 255, 0.1); color: #f5f5f7; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
  .button-wrap { display: inline-block; padding: 2px; }

  /* MARK: Social preview */
  .social .brand { position: absolute; left: calc(var(--u) * 150); top: 50%; transform: translateY(-50%); width: calc(var(--u) * 960); }
  .social .brand img.icon { width: calc(var(--u) * 260); height: calc(var(--u) * 260); display: block; margin-bottom: calc(var(--u) * 28); filter: drop-shadow(0 calc(var(--u) * 10) calc(var(--u) * 24) rgba(0,0,0,0.45)); }
  .social .brand h1 { font-size: calc(var(--u) * 190); font-weight: 800; letter-spacing: -0.035em; line-height: 1; }
  .social .brand p { margin-top: calc(var(--u) * 30); font-size: calc(var(--u) * 46); line-height: 1.3; font-weight: 500; color: rgba(245,245,247,0.66); letter-spacing: -0.01em; }
  .social .brand .tags { margin-top: calc(var(--u) * 44); font-size: calc(var(--u) * 38); font-weight: 600; color: rgba(245,245,247,0.5); letter-spacing: 0.01em; }
</style>
</head>
<body>
<div id="root"></div>
<script>
const spec = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const root = document.getElementById("root");
const W = spec.width, H = spec.height, U = W / 2400;
const el = (html) => { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const ICONS = {
  sidebar: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2.5" y="4" width="15" height="12" rx="2.5"/><path d="M8 4v12"/></svg>',
  back: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>',
  fwd: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.45"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>',
  share: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2.8v10M6.6 6 10 2.6 13.4 6"/><path d="M7 8.5H5.5A1.5 1.5 0 0 0 4 10v6a1.5 1.5 0 0 0 1.5 1.5h9A1.5 1.5 0 0 0 16 16v-6a1.5 1.5 0 0 0-1.5-1.5H13"/></svg>',
  plus: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M10 4v12M4 10h12"/></svg>',
  tabs: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="6" width="11" height="11" rx="2"/><path d="M6.5 3.5H15a1.8 1.8 0 0 1 1.8 1.8v8.4"/></svg>',
  lock: '<svg class="lock" viewBox="0 0 10 12" fill="currentColor"><path d="M2 5V3.6a3 3 0 0 1 6 0V5h.3c.7 0 1.2.5 1.2 1.2v4.6c0 .7-.5 1.2-1.2 1.2H1.7C1 12 .5 11.5.5 10.8V6.2C.5 5.5 1 5 1.7 5H2Zm1.3 0h3.4V3.6a1.7 1.7 0 0 0-3.4 0V5Z"/></svg>',
  signal: '<svg viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>',
  wifi: '<svg viewBox="0 0 16 12" fill="currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.4 10.4 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.6 8.6 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.6 6.6 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.5c-.5 0-1 .2-1.3.5L8 11.6l1.3-1.8c-.3-.3-.8-.5-1.3-.5Z"/></svg>',
  battery: '<svg viewBox="0 0 27 12" fill="none"><rect x="0.6" y="0.6" width="22.8" height="10.8" rx="3.2" stroke="currentColor" stroke-opacity="0.4" stroke-width="1.1"/><rect x="2.2" y="2.2" width="17" height="7.6" rx="1.8" fill="currentColor"/><path d="M25 4.2v3.6c.8-.3 1.4-1 1.4-1.8s-.6-1.5-1.4-1.8Z" fill="currentColor" fill-opacity="0.45"/></svg>',
  cc: '<svg viewBox="0 0 16 14" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="1" y="1" width="14" height="5" rx="2.5"/><circle cx="12.5" cy="3.5" r="1.2" fill="currentColor"/><rect x="1" y="8" width="14" height="5" rx="2.5"/><circle cx="3.5" cy="10.5" r="1.2" fill="currentColor"/></svg>',
  search: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6" r="4.5"/><path d="m9.5 9.5 3.3 3.3"/></svg>',
  ball: '<svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="5.8"/><path d="M2.6 3.4c1.6 1 2.4 2.3 2.4 3.6s-.8 2.6-2.4 3.6M11.4 3.4C9.8 4.4 9 5.7 9 7s.8 2.6 2.4 3.6"/></svg>',
};

/** A 256 px tile of 1-bit noise from a seeded generator, so every render dithers the same. */
function ditherTile() {
  const c = document.createElement("canvas");
  c.width = c.height = 256;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(256, 256);
  let seed = 0x5c0e11e;
  const rand = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  for (let i = 0; i < img.data.length; i += 4) {
    const on = rand() < 0.5 ? 255 : 0;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = on;
    img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c.toDataURL("image/png");
}

function captionHTML(c, extraClass = "") {
  if (!c || !c.title) return "";
  return `<div class="caption ${extraClass}">
    ${c.title ? `<div class="title">${c.title.split("\n").map((line) => esc(line).replace(/\*([^*]+)\*/g, '<span class="key">$1</span>')).join("<br>")}</div>` : ""}
    ${c.subtitle ? `<div class="subtitle">${esc(c.subtitle)}</div>` : ""}
  </div>`;
}

function windowHTML(image, url, s, contentH) {
  return `<div class="window">
    <div class="toolbar">
      <div class="lights"><i></i><i></i><i></i></div>
      <div class="tb-icon">${ICONS.sidebar}</div>
      <div class="tb-icon">${ICONS.back}</div>
      <div class="tb-icon">${ICONS.fwd}</div>
      <div class="address">${ICONS.lock}<span>${esc(url)}</span></div>
      <div class="tb-right"><div class="tb-icon">${ICONS.share}</div><div class="tb-icon">${ICONS.plus}</div><div class="tb-icon">${ICONS.tabs}</div></div>
    </div>
    <div class="content" style="--content-h:${contentH}px">${image ? `<img src="${image}">` : ""}</div>
  </div>`;
}

function phoneHTML(p, w, left, top) {
  const sb = Math.round(w * 0.138);
  return `<div class="phone" style="--ph-w:${w}px; --sb-h:${sb}px; left:${left}px; top:${top}px">
    <div class="screen" style="background:${p.bg}">
      <div class="island"></div>
      <div class="statusbar" style="color:${p.ink}"><span>9:41</span><span class="glyphs">${ICONS.signal}${ICONS.wifi}${ICONS.battery}</span></div>
      <img src="${p.image}">
      <div class="homebar" style="background:${p.ink}"></div>
    </div>
  </div>`;
}

function render() {
  const theme = spec.theme;
  const bare = spec.kind === "bare" || spec.kind === "button";
  const canvas = el(`<div class="canvas ${theme} ${bare ? "bare" : ""} ${spec.kind}"></div>`);
  canvas.style.setProperty("--w", W + "px");
  canvas.style.setProperty("--h", H + "px");
  canvas.style.setProperty("--u", U + "px");
  if (spec.titleSize) canvas.style.setProperty("--title-size", spec.titleSize);
  if (!bare) {
    canvas.append(el('<div class="field"></div>'), el('<div class="halftone"></div>'), el('<div class="dither"></div>'));
    canvas.style.setProperty("--dither", `url(${ditherTile()})`);
    canvas.style.setProperty("--dot", Math.max(6, Math.round(10 * U)) + "px");
    if (spec.glowY) canvas.style.setProperty("--glow-y", spec.glowY);
  }

  if (spec.kind === "browser") {
    const capTop = Math.round(118 * U);
    canvas.style.setProperty("--cap-top", capTop + "px");
    canvas.insertAdjacentHTML("beforeend", captionHTML(spec.caption));
    const winW = Math.round((spec.windowWidth ?? 1960) * U);
    const s = winW / (spec.viewportWidth ?? 1280);
    const top = Math.round((spec.windowTop ?? (spec.caption?.subtitle ? 372 : 300)) * U);
    canvas.style.setProperty("--s", s + "px");
    canvas.style.setProperty("--win-w", winW + "px");
    canvas.style.setProperty("--win-left", Math.round((W - winW) / 2) + "px");
    canvas.style.setProperty("--win-top", top + "px");
    // The window runs off the bottom edge.
    const contentH = H - top - Math.round(52 * s) + Math.round(80 * U);
    canvas.insertAdjacentHTML("beforeend", windowHTML(spec.image, spec.url, s, contentH));
  } else if (spec.kind === "phones") {
    canvas.style.setProperty("--cap-top", Math.round(118 * U) + "px");
    canvas.insertAdjacentHTML("beforeend", captionHTML(spec.caption));
    const w = Math.round((spec.phoneWidth ?? 600) * U);
    const gap = Math.round(110 * U);
    const top = Math.round((spec.phoneTop ?? (spec.caption?.subtitle ? 380 : 310)) * U);
    const total = w * 2 + gap;
    const x0 = Math.round((W - total) / 2);
    spec.phones.forEach((p, i) => canvas.insertAdjacentHTML("beforeend", phoneHTML(p, w, x0 + i * (w + gap), top + (i === 1 ? Math.round(70 * U) : 0))));
  } else if (spec.kind === "mac") {
    // The panel at its own pixels (a 2× render on a canvas that stands for a 1200pt screen), dropped
    // from Scoreline's status item, the menu bar fading in from the left: the launch brief's framing.
    const s = (spec.macScale ?? 2) * U;
    canvas.style.setProperty("--s", s + "px");
    canvas.insertAdjacentHTML("beforeend", `<div class="menubar">
      <div class="item active"><span class="score">${esc(spec.menubarText ?? "MIL 10–1 TB · Bot 9th")}</span></div>
      <div class="item">${ICONS.battery}</div><div class="item">${ICONS.wifi}</div><div class="item">${ICONS.search}</div><div class="item">${ICONS.cc}</div>
      <div class="item">${esc(spec.clock ?? "Tue Oct 27  9:41 PM")}</div>
    </div>`);
    canvas.style.setProperty("--cap-top", Math.round((spec.capTop ?? 520) * U) + "px");
    canvas.style.setProperty("--cap-left", Math.round(170 * U) + "px");
    canvas.style.setProperty("--cap-width", Math.round(900 * U) + "px");
    canvas.insertAdjacentHTML("beforeend", captionHTML(spec.caption, "left"));
    const p = (spec.panels ?? [])[0] ?? {};
    const pw = Math.round((spec.panelWidth ?? 420) * s);
    const top = Math.round(24 * s + 5 * s);
    const node = p.image
      ? el(`<div class="panel" style="top:${top}px; width:${pw}px"><img src="${p.image}"></div>`)
      : el(`<div class="panel placeholder" style="top:${top}px; width:${pw}px; height:${H}px; font-size:${Math.round(30 * U)}px"><div>
          ${spec.icon ? `<img src="${spec.icon}" style="width:${Math.round(150 * U)}px; display:block; margin:0 auto ${Math.round(28 * U)}px">` : ""}
          ${esc(p.label ?? "Scoreline for Mac")}<div style="font-size:${Math.round(22 * U)}px; font-weight:500; margin-top:${Math.round(10 * U)}px; opacity:0.8">Screenshot coming soon</div></div></div>`);
    canvas.append(node);
    root.append(canvas);
    // Under the status item, as macOS places it, but never past the screen's right margin.
    const item = canvas.querySelector(".menubar .item.active").getBoundingClientRect();
    const left = Math.min(item.left + item.width / 2 - pw / 2, W - pw - Math.round(14 * s));
    node.style.left = Math.round(left) + "px";
    return;
  } else if (spec.kind === "grid") {
    // A bento: the first card large on the left, the others stacked on the right, each with its label under it.
    canvas.style.setProperty("--cap-top", Math.round(118 * U) + "px");
    canvas.insertAdjacentHTML("beforeend", captionHTML(spec.caption));
    const aspect = spec.cardAspect ?? 0.503;
    const L = Math.round(64 * U), g = Math.round(40 * U), G = Math.round(48 * U);
    const total = Math.round((spec.cardsWidth ?? 2240) * U);
    // Both columns end together: 2·(W2·a + L) + g = W1·a + L, and W1 + G + W2 = total.
    const W1 = Math.round((total - G + (L + g) / (2 * aspect)) / 1.5);
    const H1 = Math.round(W1 * aspect);
    const W2 = total - G - W1;
    const H2 = Math.round(W2 * aspect);
    const x0 = Math.round((W - total) / 2);
    const y0 = Math.round((spec.cardsTop ?? (spec.caption?.subtitle ? 380 : 320)) * U);
    const card = (c, x, y, w, h) => `<div class="card" style="position:absolute; left:${x}px; top:${y}px; width:${w}px">
      <div class="shot" style="height:${h}px; --pos:${c.position ?? "center"}"><img src="${c.image}"></div>
      <div class="label"><b>${esc(c.title)}</b>${c.detail ? `<span>${esc(c.detail)}</span>` : ""}</div>
    </div>`;
    const [first, ...rest] = spec.cards;
    let html = card(first, x0, y0, W1, H1);
    rest.slice(0, 2).forEach((c, i) => { html += card(c, x0 + W1 + G, y0 + i * (H2 + L + g), W2, H2); });
    canvas.insertAdjacentHTML("beforeend", html);
  } else if (spec.kind === "bare") {
    if (spec.phone) {
      const w = spec.width - 2;
      canvas.insertAdjacentHTML("beforeend", phoneHTML(spec.phone, w, 1, 1));
    } else {
      const s = spec.width / (spec.viewportWidth ?? 1280);
      canvas.style.setProperty("--s", s + "px");
      canvas.style.setProperty("--win-w", spec.width + "px");
      canvas.insertAdjacentHTML("beforeend", windowHTML(spec.image, spec.url, s, H - Math.round(52 * s)));
    }
  } else if (spec.kind === "button") {
    const glyph = spec.icon === "download"
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 7.2v9.2M8.2 12.8 12 16.6l3.8-3.8"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M2.8 12h18.4M12 2.5c2.6 2.7 3.9 5.9 3.9 9.5s-1.3 6.8-3.9 9.5c-2.6-2.7-3.9-5.9-3.9-9.5s1.3-6.8 3.9-9.5Z"/></svg>';
    canvas.style.width = "auto"; canvas.style.height = "auto"; canvas.style.display = "inline-block";
    canvas.insertAdjacentHTML("beforeend", `<div class="button-wrap"><div class="btn ${spec.variant}">${glyph}<span>${esc(spec.label)}</span></div></div>`);
  } else if (spec.kind === "social") {
    canvas.insertAdjacentHTML("beforeend", `<div class="brand">
      <img class="icon" src="${spec.icon}">
      <h1>Scoreline</h1>
      <p>${spec.tagline.split("\n").map(esc).join("<br>")}</p>
      <div class="tags">${esc(spec.tags)}</div>
    </div>`);
    const winW = Math.round(1400 * U);
    const s = winW / 1280;
    canvas.style.setProperty("--s", s + "px");
    canvas.style.setProperty("--win-w", winW + "px");
    canvas.style.setProperty("--win-left", Math.round(1300 * U) + "px");
    canvas.style.setProperty("--win-top", Math.round(260 * U) + "px");
    canvas.insertAdjacentHTML("beforeend", windowHTML(spec.image, spec.url, s, H));
  }
  root.append(canvas);
}
render();
Promise.all([...document.images].map((img) => img.decode().catch(() => {}))).then(() => document.fonts.ready).then(() => { document.body.dataset.ready = "1"; });
</script>
</body>
</html>
